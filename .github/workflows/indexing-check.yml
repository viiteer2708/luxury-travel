name: Indexing check (Horizonte Exclusivo)

# Inspección automática de todas las URLs del sitemap.xml cada 48 horas.
# - Corre inspect_sitemap.py con service account desde el secret GOOGLE_SA_JSON.
# - Compara vs el último snapshot committeado en scripts_seo/latest_inspection.json.
# - Si hay cambios (totales, nuevas indexadas, caídas, cambio de estado en una URL
#   clave, o Google ha vuelto a rastrear una página que sigue fuera del índice):
#     · Committea el nuevo snapshot.
#     · Avisa por Telegram con la versión corta (last_telegram.md) y abre un issue
#       con el informe completo (last_summary.md).
# - Si no hay cambios, solo actualiza el snapshot silenciosamente (sin aviso).
#
# Primer disparo tras configurar el secret: manual via "Run workflow".

on:
  schedule:
    # 07:00 UTC cada 2 días = 09:00 Europe/Madrid en verano (CEST)
    # 08:00 Europe/Madrid en invierno (CET) — diferencia aceptable.
    - cron: "0 7 */2 * *"
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyJWT
        run: python -m pip install --quiet "PyJWT>=2.7,<3" cryptography

      - name: Run inspection
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: |
          if [ -z "$GOOGLE_SA_JSON" ]; then
            echo "::error::GOOGLE_SA_JSON secret no configurado. Ve a Settings → Secrets → Actions y añádelo."
            exit 1
          fi
          python scripts_seo/inspect_sitemap.py --out scripts_seo/new_inspection.json

      - name: Compare vs previous snapshot
        id: compare
        # Sin continue-on-error: si el script REVIENTA (rc>=2) el job debe caer, para que no se
        # promocione el snapshot nuevo pisando el anterior y para que llegue el aviso de fallo.
        # rc=1 significa «hay cambios que avisar» y es un resultado normal, no un error.
        run: |
          old=scripts_seo/latest_inspection.json
          if [ ! -f "$old" ]; then
            old=scripts_seo/baselines/inspeccion_20260421.json
          fi
          set +e
          python scripts_seo/compare_and_alert.py \
            --new scripts_seo/new_inspection.json \
            --old "$old" \
            --summary-out scripts_seo/last_summary.md \
            --telegram-out scripts_seo/last_telegram.md
          rc=$?
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -gt 1 ]; then
            echo "::error::compare_and_alert.py ha reventado (rc=$rc); no se promociona el snapshot"
            exit "$rc"
          fi

      - name: Check alert flag
        id: alert
        run: |
          if [ -f scripts_seo/.alert ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            rm scripts_seo/.alert
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Promote new inspection to latest
        run: mv scripts_seo/new_inspection.json scripts_seo/latest_inspection.json

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts_seo/latest_inspection.json scripts_seo/last_summary.md
          if git diff --cached --quiet; then
            echo "Sin cambios en snapshot."
          else
            if [ "${{ steps.alert.outputs.changed }}" = "true" ]; then
              git commit -m "Indexing check: cambios detectados ($(date -u +%Y-%m-%d))"
            else
              git commit -m "Indexing check: sin cambios ($(date -u +%Y-%m-%d)) [skip ci]"
            fi
            git push
          fi

      - name: Open issue if changes detected
        if: steps.alert.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('scripts_seo/last_summary.md', 'utf8');
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Indexing check ${today}: cambios detectados`,
              body,
              labels: ['seo', 'indexing']
            });

      - name: Notify Telegram (cambios)
        if: steps.alert.outputs.changed == 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then echo "Telegram sin configurar; me salto el aviso"; exit 0; fi
          # Versión corta (la escribe compare_and_alert.py); si no existiera, recorte del informe.
          # (recorte por CARACTERES: head -c corta bytes y puede partir un emoji → UTF-8 inválido → Telegram 400)
          if [ -f scripts_seo/last_telegram.md ]; then CUERPO="$(cat scripts_seo/last_telegram.md)"; else CUERPO="$(python3 -c "print(open('scripts_seo/last_summary.md',encoding='utf-8').read()[:3000])")"; fi
          TEXTO="🔎 Vigía SEO Horizonte — cambios de indexación:
          ${CUERPO}

          Informe completo: ${{ github.server_url }}/${{ github.repository }}/blob/master/scripts_seo/last_summary.md"
          RESP="$(curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode chat_id="$TG_CHAT" \
            --data-urlencode text="$TEXTO")"
          # curl devuelve 0 aunque la API conteste 400/403: hay que mirar el "ok" del JSON
          if echo "$RESP" | grep -q '"ok":true'; then echo "Aviso de cambios enviado a Telegram"; else echo "::error::Telegram no aceptó el aviso: $(echo "$RESP" | head -c 300)"; exit 1; fi

      - name: Notify Telegram (fallo del vigía)
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then echo "Telegram sin configurar"; exit 0; fi
          RESP="$(curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode chat_id="$TG_CHAT" \
            --data-urlencode text="🔴 El vigía SEO de Horizonte ha FALLADO. Revisar: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")"
          echo "$RESP" | grep -q '"ok":true' || echo "::warning::Telegram no aceptó el aviso de fallo: $(echo "$RESP" | head -c 300)"
